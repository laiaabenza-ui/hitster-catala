<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster Català</title>
<style>
  :root{
    --gold:#ffd400;
    --dark:#1f1f24;
    --cream:#faf5e6;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--dark);
    color: var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  h1{
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:28px;
  }
  .card{
    width:280px;
    height:280px;
    border-radius:16px;
    border:3px solid var(--gold);
    position:relative;
    background:var(--dark);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:14px 10px;
  }
  .wave-row{
    display:flex;
    justify-content:center;
    width:100%;
  }
  .wave-row svg{
    display:block;
  }
  .qmark-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .qmark{
    font-size:64px;
    color:var(--gold);
    font-weight:bold;
  }
  button{
    font-size:14px;
    font-weight:bold;
    letter-spacing:0.03em;
    padding:12px 24px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    background:var(--gold);
    color:var(--dark);
  }
  button.secondary{
    background:transparent;
    color:var(--cream);
    border:1.5px solid var(--cream);
    margin-top:20px;
  }
  button:disabled{
    opacity:0.35;
    cursor:default;
  }
  .veil{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    text-align:center;
    height:100%;
  }
  .error{
    text-align:center;
    color:#a9a9ac;
    font-size:14px;
    max-width:280px;
    line-height:1.5;
  }
  .status{
    font-size:12px;
    color:#8a8a8e;
    margin-top:6px;
    text-align:center;
    max-width:260px;
    line-height:1.4;
  }
  .login-note{
    font-size:11px;
    color:#7a7a7e;
    margin-top:10px;
  }
</style>
</head>
<body>

<h1>Hitster Català</h1>

<div id="app"></div>

<script>
// ====== CONFIG ======
const CLIENT_ID = '9e2ebdcd164645d9894be217031acb62';
const REDIRECT_URI = 'https://laiaabenza-ui.github.io/hitster-catala/play.html';
const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';

let params = new URLSearchParams(window.location.search);
let trackId = params.get('id');
let year = params.get('any') || '';
let artist = params.get('artista') || '';
let title = params.get('titol') || '';

const app = document.getElementById('app');

// ---------- PKCE helpers ----------
function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  const rnd = crypto.getRandomValues(new Uint8Array(len));
  for (let i = 0; i < len; i++) out += chars[rnd[i] % chars.length];
  return out;
}
async function sha256(plain) {
  const data = new TextEncoder().encode(plain);
  return crypto.subtle.digest('SHA-256', data);
}
function base64UrlEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function saveTokens(data) {
  const expiresAt = Date.now() + (data.expires_in * 1000) - 30000; // 30s margin
  localStorage.setItem('sp_access_token', data.access_token);
  localStorage.setItem('sp_expires_at', String(expiresAt));
  if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
}

function getStoredAccessToken() {
  const token = localStorage.getItem('sp_access_token');
  const expiresAt = parseInt(localStorage.getItem('sp_expires_at') || '0', 10);
  if (token && Date.now() < expiresAt) return token;
  return null;
}

async function refreshAccessToken() {
  const refreshToken = localStorage.getItem('sp_refresh_token');
  if (!refreshToken) return null;
  const resp = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: refreshToken,
      client_id: CLIENT_ID,
    }),
  });
  if (!resp.ok) return null;
  const data = await resp.json();
  saveTokens(data);
  return data.access_token;
}

async function startLogin() {
  const verifier = randomString(64);
  sessionStorage.setItem('sp_pkce_verifier', verifier);
  // preserve the song params through the redirect round-trip
  sessionStorage.setItem('sp_return_params', window.location.search);
  const challenge = base64UrlEncode(await sha256(verifier));

  const authUrl = new URL('https://accounts.spotify.com/authorize');
  authUrl.searchParams.set('client_id', CLIENT_ID);
  authUrl.searchParams.set('response_type', 'code');
  authUrl.searchParams.set('redirect_uri', REDIRECT_URI);
  authUrl.searchParams.set('scope', SCOPES);
  authUrl.searchParams.set('code_challenge_method', 'S256');
  authUrl.searchParams.set('code_challenge', challenge);
  window.location.href = authUrl.toString();
}

async function exchangeCodeForToken(code) {
  const verifier = sessionStorage.getItem('sp_pkce_verifier');
  const resp = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier,
    }),
  });
  if (!resp.ok) throw new Error('token_exchange_failed');
  const data = await resp.json();
  saveTokens(data);
}

// ---------- Bear mascot (senyera t-shirt + question mark) ----------
const bearSvg = `
  <svg width="130" height="165" viewBox="-20 -10 240 280" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="188" rx="68" ry="56" fill="#8a6248"/>
    <ellipse cx="55" cy="232" rx="38" ry="26" fill="#8a6248"/>
    <ellipse cx="145" cy="232" rx="38" ry="26" fill="#8a6248"/>
    <ellipse cx="55" cy="234" rx="20" ry="14" fill="#d9b98f"/>
    <ellipse cx="145" cy="234" rx="20" ry="14" fill="#d9b98f"/>
    <ellipse cx="28" cy="158" rx="24" ry="22" fill="#8a6248" transform="rotate(-14 28 158)"/>
    <ellipse cx="172" cy="158" rx="24" ry="22" fill="#8a6248" transform="rotate(14 172 158)"/>
    <path d="M40,146 Q100,126 160,146 L176,210 Q100,228 24,210 Z" fill="#ffffff"/>
    <path d="M80,148 Q100,164 120,148 Q112,140 100,140 Q88,140 80,148 Z" fill="#e9e9ec"/>
    <ellipse cx="42" cy="206" rx="17" ry="14" fill="#8a6248" transform="rotate(-10 42 206)"/>
    <ellipse cx="158" cy="206" rx="17" ry="14" fill="#8a6248" transform="rotate(10 158 206)"/>
    <rect x="66" y="160" width="64" height="54" rx="9" fill="#ffd400" stroke="#1f1f24" stroke-width="2"/>
    <rect x="72.9" y="165.5" width="7.1" height="43" fill="#bf1721"/>
    <rect x="87.1" y="165.5" width="7.1" height="43" fill="#bf1721"/>
    <rect x="101.3" y="165.5" width="7.1" height="43" fill="#bf1721"/>
    <rect x="115.5" y="165.5" width="7.1" height="43" fill="#bf1721"/>
    <text x="98" y="200" font-family="Arial, sans-serif" font-size="32" font-weight="bold"
          fill="#1f1f24" text-anchor="middle" stroke="#faf5e6" stroke-width="1.1" paint-order="stroke">?</text>
    <circle cx="48" cy="40" r="25" fill="#8a6248"/>
    <circle cx="152" cy="40" r="25" fill="#8a6248"/>
    <circle cx="48" cy="42" r="12" fill="#d9b98f"/>
    <circle cx="152" cy="42" r="12" fill="#d9b98f"/>
    <ellipse cx="100" cy="78" rx="60" ry="55" fill="#8a6248"/>
    <ellipse cx="100" cy="98" rx="33" ry="23" fill="#d9b98f"/>
    <circle cx="79" cy="73" r="6" fill="#1a1a1a"/>
    <circle cx="121" cy="73" r="6" fill="#1a1a1a"/>
    <circle cx="81.3" cy="70.3" r="1.7" fill="#fff"/>
    <circle cx="123.3" cy="70.3" r="1.7" fill="#fff"/>
    <ellipse cx="100" cy="89" rx="9" ry="6.5" fill="#1a1a1a"/>
    <path d="M100,95 L100,101" stroke="#4a3527" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M100,101 Q92,108 85,103" stroke="#4a3527" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M100,101 Q108,108 115,103" stroke="#4a3527" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>`;

// ---------- Main flow ----------
async function main() {
  // Returning from Spotify login? Handle this FIRST, before checking trackId,
  // because Spotify's redirect strips our song params (id/any/artista/titol)
  // and only appends its own ?code=&state= — we must restore them from
  // sessionStorage before deciding whether we have a song to play.
  const code = params.get('code');
  if (code) {
    app.innerHTML = `<div class="status">Iniciant sessió amb Spotify…</div>`;
    try {
      await exchangeCodeForToken(code);
      const restore = sessionStorage.getItem('sp_return_params') || '';
      window.history.replaceState({}, '', window.location.pathname + restore);
      // re-parse params now that the song info is restored
      params = new URLSearchParams(restore);
      trackId = params.get('id');
      year = params.get('any') || '';
      artist = params.get('artista') || '';
      title = params.get('titol') || '';
    } catch (e) {
      app.innerHTML = `<div class="error">No s'ha pogut iniciar sessió amb Spotify. Torna-ho a provar escanejant la carta de nou.</div>`;
      return;
    }
  }

  if (!trackId) {
    app.innerHTML = `<div class="error">Escaneja una carta del joc per començar.<br>Aquesta pàgina no funciona per si sola.</div>`;
    return;
  }

  let accessToken = getStoredAccessToken();
  if (!accessToken) {
    accessToken = await refreshAccessToken();
  }

  if (!accessToken) {
    app.innerHTML = `
      <div class="card">
        <div class="veil">
          <div class="qmark">?</div>
          <button id="loginBtn">Inicia sessió amb Spotify</button>
          <div class="login-note">Cal Spotify Premium.<br>Només caldrà fer-ho un cop en aquest mòbil.</div>
        </div>
      </div>`;
    document.getElementById('loginBtn').onclick = startLogin;
    return;
  }
  renderPlayer(accessToken);
}

function renderPlayer(accessToken) {
  const waveSvg = `
    <div class="wave-row">
    <svg width="230" height="20" viewBox="0 0 230 20" xmlns="http://www.w3.org/2000/svg">
      <path d="M5,10 Q15,4 25,10 T45,10 T65,10 T85,10" stroke="#faf5e6" stroke-width="1.3" fill="none"/>
      <rect x="97" y="4" width="36" height="12" rx="1.5" fill="#ffd400" stroke="#1f1f24" stroke-width="1.1"/>
      <rect x="102" y="6.5" width="4.5" height="7" fill="#bf1721"/>
      <rect x="110" y="6.5" width="4.5" height="7" fill="#bf1721"/>
      <rect x="118" y="6.5" width="4.5" height="7" fill="#bf1721"/>
      <rect x="126" y="6.5" width="4.5" height="7" fill="#bf1721"/>
      <path d="M145,10 Q155,4 165,10 T185,10 T205,10 T225,10" stroke="#faf5e6" stroke-width="1.3" fill="none"/>
    </svg>
    </div>`;

  app.innerHTML = `
    <div class="card">
      ${waveSvg}
      <div class="qmark-wrap">
        <div class="qmark">?</div>
        <button id="playBtn">▶ Reprodueix</button>
        <div class="status" id="status"></div>
      </div>
      ${waveSvg}
    </div>
  `;

  const playBtn = document.getElementById('playBtn');
  const statusEl = document.getElementById('status');

  let player = null;
  let deviceId = null;
  let sdkReady = false;
  let hasStarted = false;

  window.onSpotifyWebPlaybackSDKReady = () => {
    player = new Spotify.Player({
      name: 'Hitster Català',
      getOAuthToken: cb => { cb(getStoredAccessToken() || accessToken); },
      volume: 0.9,
    });

    player.addListener('ready', ({ device_id }) => {
      deviceId = device_id;
      sdkReady = true;
      statusEl.textContent = '';
    });

    player.addListener('player_state_changed', (state) => {
      if (!state) return;
      if (hasStarted) {
        playBtn.textContent = state.paused ? '▶ Reprodueix' : '⏸ Pausa';
      }
    });

    player.addListener('initialization_error', () => {
      statusEl.textContent = 'El navegador no permet reproduir-hi. Prova amb Chrome o Safari actualitzat.';
    });
    player.addListener('authentication_error', () => {
      statusEl.textContent = 'Sessió caducada. Recarrega i torna a iniciar sessió.';
      localStorage.removeItem('sp_access_token');
    });
    player.addListener('account_error', () => {
      statusEl.textContent = 'Cal un compte Spotify PREMIUM per reproduir la cançó sencera.';
    });
    player.addListener('playback_error', () => {
      statusEl.textContent = 'No s\'ha pogut reproduir aquesta cançó.';
    });

    player.connect();
  };

  if (!document.getElementById('spotify-sdk-script')) {
    const s = document.createElement('script');
    s.id = 'spotify-sdk-script';
    s.src = 'https://sdk.scdn.co/spotify-player.js';
    document.body.appendChild(s);
  } else if (window.Spotify) {
    window.onSpotifyWebPlaybackSDKReady();
  }

  async function playTrack() {
    let token = getStoredAccessToken();
    if (!token) token = await refreshAccessToken();
    if (!token) { statusEl.textContent = 'Sessió caducada, recarrega la pàgina.'; return; }

    const resp = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
    });

    if (resp.status === 403 || resp.status === 404) {
      statusEl.textContent = 'Cal Spotify Premium per reproduir la cançó sencera.';
      return false;
    }
    if (!resp.ok && resp.status !== 204) {
      statusEl.textContent = 'No s\'ha pogut reproduir. Torna-ho a provar.';
      return false;
    }
    return true;
  }

  playBtn.onclick = () => {
    if (hasStarted) {
      // toggle pause/resume
      player.togglePlay();
      return;
    }
    playBtn.disabled = true;
    playBtn.textContent = 'Carregant…';
    let attempts = 0;
    const maxAttempts = 40;
    const poll = setInterval(async () => {
      attempts++;
      if (sdkReady && deviceId) {
        clearInterval(poll);
        const ok = await playTrack();
        playBtn.disabled = false;
        if (ok !== false) {
          hasStarted = true;
          playBtn.textContent = '⏸ Pausa';
        } else {
          playBtn.textContent = '▶ Reprodueix';
        }
      } else if (attempts >= maxAttempts) {
        clearInterval(poll);
        playBtn.disabled = false;
        playBtn.textContent = 'Torna a provar';
      }
    }, 250);
  };
}

main();
</script>

</body>
</html>
